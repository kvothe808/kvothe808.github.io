<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b080d">
<meta name="description" content="El Cau, el joc de cartes de les filaes d'Alcoi: juega con tu compañera contra dos rivales.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#1b080d}
body{margin:0;font:14px/1.4 system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>CotoCau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: una mesa de juego a pantalla completa — marcador arriba, compañera enfrente, rivales a los lados, tapete granate al centro y tu mano abajo */
:root{
  --bg:#1b080d; --felt:#5a1b27; --felt-deep:#2b0a11; --panel:#2a0d14; --seat:#3a121b;
  --ink:#f4ead8; --ink-soft:#c8b29a; --line:rgba(244,234,216,.16);
  --gold:#e3b24f; --gold-ink:#2a1206; --rival:#e38f7c;
  --f-display:"Alegreya SC", "Palatino Linotype", Georgia, serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.35;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#app{height:100%;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:7px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.score{display:flex;flex-direction:column;gap:3px;line-height:1}
.score.them{align-items:flex-end}
.lbl{font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.score b{font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:5px}
.score b small{font:700 13px var(--f-body);letter-spacing:.02em}
.score.us b{color:var(--gold)} .score.them b{color:var(--rival)}
.mid{text-align:center}
.brand{font:800 24px/1 var(--f-display);letter-spacing:.05em}
.info{font-size:12px;color:var(--ink-soft);margin-top:3px;font-variant-numeric:tabular-nums}

.tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.btn{font-weight:700;font-size:13px;background:rgba(244,234,216,.06);border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;color:var(--ink)}
.btn:hover{background:rgba(244,234,216,.12)}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.warn{border-color:var(--rival);color:var(--rival)}
.btn.sing{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-size:15px;padding:8px 18px;animation:glow 1.6s ease-in-out infinite}

.board{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.row{flex:1;min-height:0;display:grid;grid-template-columns:72px minmax(0,1fr) 72px;gap:6px}
.felt{position:relative;min-height:0;border-radius:20px;background:radial-gradient(ellipse at 50% 40%,var(--felt),var(--felt-deep) 78%);box-shadow:inset 0 0 0 1px rgba(227,178,79,.28),inset 0 0 0 7px rgba(0,0,0,.12),inset 0 0 50px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:14px 10px;overflow:hidden}
.felt::before{content:"";position:absolute;inset:7px;border-radius:14px;border:1px dashed rgba(227,178,79,.18);pointer-events:none}
.table{--cw:clamp(46px,13.5vw,64px);position:absolute;inset:10px}
.slot{position:absolute;width:var(--cw);height:calc(var(--cw)*1.5);transform:translate(-50%,-50%) rotate(var(--rot,0deg))}
.slot>.card,.slot>.stk{position:absolute;left:0;top:0}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:rgba(244,234,216,.4);font:500 14px var(--f-display);letter-spacing:.08em}
.fly{position:fixed;z-index:15;pointer-events:none;display:flex;left:0;top:0}
.fly .back+.back{margin-left:-30px}

.seat{display:flex;align-items:center;gap:8px;color:var(--ink-soft);font-size:13px;border-radius:14px;padding:4px 8px;transition:background .3s}
.seat.top{justify-content:center;min-height:52px}
.seat.side{flex-direction:column;justify-content:center;text-align:center;gap:5px;padding:6px 2px}
.seat.turn{background:rgba(227,178,79,.13);color:var(--ink)}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--f-display);background:var(--seat);border:1.5px solid var(--rival);color:var(--ink)}
.av.us{border-color:var(--gold)}
.seat.turn .av{box-shadow:0 0 0 4px rgba(227,178,79,.35)}
.who{display:flex;flex-direction:column;gap:1px;line-height:1.15}
.seat.side .who{align-items:center}
.nm{font-weight:700;color:var(--ink)}
.sub{font-size:11px;color:var(--ink-soft)}
.backs{display:flex;min-height:58px}
.back{flex:none;width:39px;height:58px;border-radius:5px;background:radial-gradient(circle at 50% 50%,#e3b24f 0 4px,transparent 4.5px),repeating-linear-gradient(45deg,#7d2333 0 5px,#5a1623 5px 10px);border:1.5px solid #e3b24f;box-shadow:inset 0 0 0 2px #5a1623,0 3px 6px rgba(0,0,0,.45)}
.deck-clasica .back{background:url(classic.webp) 0% 100% / 1000% 500% no-repeat;border:0;box-shadow:0 3px 6px rgba(0,0,0,.45)}
.back+.back{margin-left:-16px}
.seat.side .backs{flex-direction:column;align-items:center;min-height:0}
.seat.side .back{width:56px;height:38px;background-size:auto}
.deck-clasica .seat.side .back{background:url(classic.webp) 0% 100% / 1000% 500% no-repeat;width:38px;height:58px}
.seat.side .back+.back{margin-left:0;margin-top:-22px}
.deck-clasica .seat.side .back+.back{margin-top:-40px}
.bubble{font-size:11px;font-weight:800;color:var(--gold);min-height:14px;letter-spacing:.02em}
.dealer{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(227,178,79,.5);border-radius:999px;padding:1px 5px}

/* Cartas españolas dibujadas en SVG */
.card{--cw:56px;width:var(--cw);height:calc(var(--cw)*1.5);flex:none;border-radius:calc(var(--cw)*.1);position:relative;box-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.38);transition:transform .25s,box-shadow .25s;user-select:none}
.card svg{display:block;width:100%;height:100%}
.card.cl{background:url(classic.webp) no-repeat;background-size:1000% 500%}
.pair{display:flex;align-items:flex-start;flex:none}
.pair .card+.card{margin-left:calc(var(--cw)*-.55);margin-top:calc(var(--cw)*.28)}
.chain .card.incoming{margin-top:calc(var(--cw)*.28)}
.card.incoming{animation:drop .45s ease-out}
.card.taking{transform:translateY(-6px) scale(1.05);box-shadow:0 0 0 3px var(--gold),0 10px 20px rgba(0,0,0,.45)}
.card.reserved{box-shadow:0 0 0 2px var(--felt-deep),0 0 0 4px var(--gold)}
.card.last{box-shadow:0 0 0 2px rgba(244,234,216,.6),0 6px 14px rgba(0,0,0,.38)}
.chain{display:flex;align-items:center;padding:12px 10px 8px;border:1.5px solid var(--gold);border-radius:12px;background:rgba(0,0,0,.22);position:relative}
.chain .card+.card{margin-left:calc(var(--cw)*-.55)}
.chain-lbl{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:999px;white-space:nowrap}

.callout{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:3}
.call{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 22px;border-radius:16px;background:rgba(27,8,13,.78);animation:pop var(--cd,1.6s) ease-out both;text-align:center}
.call b{font:800 clamp(30px,10vw,46px)/1 var(--f-display);color:var(--gold);text-shadow:0 3px 0 #2a0a10}
.call span{font-size:13px;font-weight:700;color:var(--ink)}

.narr{text-align:center;font-size:13.5px;color:var(--ink);min-height:20px;line-height:1.3}
.narr b{color:var(--gold)}
.you{display:flex;flex-direction:column;gap:6px;padding-bottom:2px}
.hand{display:flex;gap:12px;justify-content:center;min-height:calc(clamp(66px,20vw,86px)*1.5 + 26px)}
.hc{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;border-radius:10px}
.hc .card{--cw:clamp(66px,20vw,86px)}
.hc:not(:disabled):hover .card{transform:translateY(-8px)}
.hc:disabled{cursor:default}
.hc:disabled .card{filter:saturate(.8) brightness(.88)}
.hint{font-size:11px;font-weight:800;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:rgba(244,234,216,.08);color:var(--ink-soft);white-space:nowrap}
.hint.cap{background:rgba(244,234,216,.18);color:var(--ink)}
.hint.big{background:var(--gold);color:var(--gold-ink)}
.status{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;text-align:center;min-height:24px;font-size:14px;color:var(--ink-soft)}
.status b{color:var(--ink)}
.status.mine b{color:var(--gold)}

.nit{border:1px solid rgba(227,178,79,.5);background:var(--panel);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;text-align:center}
.nit h3{margin:0;font:800 18px var(--f-display);color:var(--gold);letter-spacing:.04em}
.nit p{margin:0;font-size:14px}
.nit .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.overlay{position:fixed;inset:0;background:rgba(10,3,5,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-height:640px){.overlay{align-items:center}}
.panel{background:var(--panel);border:1px solid rgba(227,178,79,.35);border-radius:20px;max-width:560px;width:100%;max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font:800 26px/1.1 var(--f-display);text-wrap:balance}
.panel h3{margin:6px 0 0;font:800 16px var(--f-display);color:var(--gold);letter-spacing:.05em}
.panel p,.panel li{font-size:14.5px;max-width:65ch}
.panel p{margin:0}
.panel ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.panel .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.pts div{border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.pts b{display:block;font:800 18px var(--f-display);color:var(--gold)}
.pts span{font-size:13px;color:var(--ink-soft)}
.sum{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.sum th,.sum td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
.sum th:first-child,.sum td:first-child{text-align:left;color:var(--ink-soft)}
.sum thead th{font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.sum thead th.us{color:var(--gold)} .sum thead th.them{color:var(--rival)}
.sum tr.tot td{font-weight:800;color:var(--ink);border-bottom:0;font-size:16px}
.big-result{font:800 20px var(--f-display);text-align:center;color:var(--gold)}
.log{list-style:none;padding:0 !important;margin:0;display:flex;flex-direction:column;gap:2px !important;font-size:13.5px}
.log li{padding:4px 0;border-bottom:1px solid var(--line)}
.aliasin{width:100%;font:600 16px var(--f-body);color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.chips{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-items:center;align-self:center;max-width:100%}
.seat.side .chips{flex-direction:column;flex-wrap:nowrap;align-items:center;gap:2px}
.seat.side .chips .chip{font-size:11px;padding:0 4px}
.chip{display:inline-flex;align-items:baseline;gap:1px;font:800 12.5px var(--f-body);background:#f4ecdb;color:#2a1a10;border-radius:5px;padding:1px 5px;box-shadow:0 1px 2px rgba(0,0,0,.35);white-space:nowrap}
.chip i{font-style:normal;font-size:.8em;font-weight:900}
.chip.s0 i{color:#b8860b}.chip.s1 i{color:#c0392b}.chip.s2 i{color:#2c5d9e}.chip.s3 i{color:#2e7d32}
.chip.tr{outline:2px solid var(--gold)}
.lastfelt{position:relative;height:250px;border-radius:16px;background:radial-gradient(ellipse at center,#1f6b46,#0f3d27);margin:6px 0 10px;--cw:54px;overflow:hidden}
.lastfelt .ls{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;animation:lsIn .45s cubic-bezier(.2,.8,.3,1.2) both}
.lastfelt .ls small{font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.35);border-radius:999px;padding:0 7px}
.lastfelt .ls.win small{background:var(--gold);color:#2a1a10}
.lastfelt .ls.win .card{box-shadow:0 0 0 3px var(--gold),0 6px 14px rgba(0,0,0,.45)}
@keyframes lsIn{from{opacity:0;left:50%;top:50%;transform:translate(-50%,-50%) scale(.4) rotate(-20deg)}}
.lastinfo{text-align:center;font-weight:700}
.exp{width:100%;min-height:150px;font:12px ui-monospace,monospace;background:rgba(0,0,0,.25);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}
.log li.hand{color:var(--gold);font-weight:700;padding-top:10px}
.co-slot{position:absolute;transform:translate(-50%,-50%);z-index:2}
.co-stock{position:absolute;left:50%;top:50%;width:var(--cw);height:calc(var(--cw)*1.5);transform:translate(-50%,-50%)}
.co-pinta{position:absolute;left:0;top:0;transform:translateX(52%) rotate(90deg);transform-origin:center}
.co-stock .back.big{transform:translateX(-22%)}
.co-count{margin-left:calc(var(--cw)*-.22)}
.co-pinta .card{--cw:inherit}
.co-stock .back.big{position:absolute;left:0;top:0;width:var(--cw);height:calc(var(--cw)*1.5);border-radius:6px}
.co-count{position:absolute;left:calc(var(--cw)*.5);top:calc(var(--cw)*.75);transform:translate(-50%,-50%);background:rgba(27,8,13,.85);color:var(--gold);font-weight:800;font-size:12px;border-radius:999px;padding:1px 7px}
.co-trump{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;color:var(--ink-soft);background:rgba(0,0,0,.25);padding:3px 9px;border-radius:999px}
.co-trump b{color:var(--gold)}
.hand.co-hand{gap:4px;flex-wrap:nowrap}
.co-reveal{display:flex}
.co-reveal .card{--cw:40px}
.co-reveal .card+.card{margin-left:-10px}
.seat.side .co-reveal{flex-direction:column;align-items:center}
.seat.side .co-reveal .card+.card{margin-left:0;margin-top:-34px}
.hand.co-hand .hc .card{--cw:clamp(46px,14.5vw,80px)}
.seat.co .back+.back{margin-left:-20px}
.seat.side.co .back+.back{margin-left:0;margin-top:-46px}
.deck-clasica .seat.side.co .back+.back{margin-top:-48px}
.btn.playopt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 16px}
.btn.playopt b{font-size:17px}
.btn.playopt small{font-weight:500;font-size:12.5px;color:var(--ink-soft)}
.devtag{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--rival);border:1px solid var(--rival);border-radius:999px;padding:1px 7px}
.contlbl{display:block;font-weight:500;font-size:12px;opacity:.85;margin-top:2px}
.pw{display:flex;gap:8px}
.pw input{flex:1;min-width:0;font:600 16px var(--f-body);color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.pwerr{color:var(--rival);font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(0,0,0,.2)}
.tabs button{border:0;background:none;border-radius:999px;padding:7px 4px;font-weight:700;cursor:pointer;color:var(--ink-soft)}
.tabs button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.draw{display:flex;justify-content:center;padding:6px 0}
.draw-card .card{--cw:90px;animation:flip 1.1s ease-out both}
@keyframes flip{0%{transform:rotateY(90deg) scale(.6);opacity:0}60%{transform:rotateY(0) scale(1.05);opacity:1}100%{transform:none}}
.menu{align-items:stretch;text-align:center}
.menu .logo{font:800 56px/1 var(--f-display);color:var(--gold);letter-spacing:.04em;text-shadow:0 3px 0 #120408}
.menu .tag{color:var(--ink-soft);font-size:14px;margin:-6px auto 4px}
.menu .stack{display:flex;flex-direction:column;gap:10px}
.menu .stack .btn{font-size:16px;padding:12px 18px}
.opt{display:flex;flex-direction:column;gap:6px}
.opt label{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.opt .desc{font-size:13px;color:var(--ink-soft)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(0,0,0,.2)}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg.four button{font-size:12.5px;padding:7px 2px}
.names{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.names span{display:flex;flex-direction:column;gap:3px;min-width:0}
.names small{font-size:11px;color:var(--ink-soft)}
.names input{width:100%;min-width:0;font:600 15px var(--f-body);color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.panel .desc{font-size:13px;color:var(--ink-soft);margin:0}
.seg button{border:0;background:none;border-radius:999px;padding:7px 6px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}

@keyframes drop{from{transform:translateY(-22px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}12%{transform:scale(1.08);opacity:1}20%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(227,178,79,.55)}50%{box-shadow:0 0 0 7px rgba(227,178,79,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media (max-height:660px){.brand{font-size:20px}.score b{font-size:25px}.tools .btn{padding:4px 11px}.seat.top{min-height:44px}}
</style>
</head>
<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

<script>
(() => {
'use strict';
/* ---------------- Motor del Cau ---------------- */
const RV = [1,2,3,4,5,6,7,10,11,12];
// Idioma: castellano (es) o valenciano (va). Los textos se escriben con L('castellano', 'valencià')
let LANG = 'es';
const L = (es, va) => LANG === 'va' ? va : es, T = (es, va) => LANG === 'va' ? va : es;   // T: donde ya hay una variable local L
const RN = [], RNA = [], RNP = [], SUITN = [], NAMES = ['Tú','Toni','Maria','Vicent'], TEAMN = [];
const fill = (a, v) => { a.splice(0, a.length, ...v); };
function applyLang(lang, names) {
  LANG = lang === 'va' ? 'va' : 'es';
  fill(RN, L(['As','2','3','4','5','6','7','Sota','Caballo','Rey'], ['As','2','3','4','5','6','7','Sota','Cavall','Rei']));
  fill(RNA, L(['el as','el 2','el 3','el 4','el 5','el 6','el 7','la sota','el caballo','el rey'], ["l'as",'el 2','el 3','el 4','el 5','el 6','el 7','la sota','el cavall','el rei']));
  fill(RNP, L(['ases','doses','treses','cuatros','cincos','seises','sietes','sotas','caballos','reyes'], ['asos','dosos','tresos','quatres','cincs','sisos','setes','sotes','cavalls','reis']));
  fill(SUITN, L(['oros','copas','espadas','bastos'], ['oros','copes','espases','bastos']));
  fill(TEAMN, L(['Nosotros','Ellos'], ['Nosaltres','Ells']));
  NAMES[0] = L('Tú', 'Tu');
  if (names) for (let i = 0; i < 3; i++) NAMES[i + 1] = (names[i] || ['Toni','Maria','Vicent'][i]).trim().slice(0, 14) || ['Toni','Maria','Vicent'][i];
}
applyLang('es');
const ofSuit = s => LANG === 'va' ? (s === 0 || s === 2 ? "d'" : 'de ') + SUITN[s] : 'de ' + SUITN[s];
const apunt = (t, n) => L(`${TEAMN[t]} se apuntan ${n} de nit.`, `${TEAMN[t]} s'apunten ${n} de nit.`);
const TARGET = 40;
const team = p => p % 2;
const ALL = []; for (let s = 0; s < 4; s++) for (let r = 0; r < 10; r++) ALL.push({ id: s*10 + r, r, s });
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clone = o => JSON.parse(JSON.stringify(o));
const cloneLite = o => { const { log, feed, rec, prevRec, ...rest } = o; const c = JSON.parse(JSON.stringify(rest)); c.log = []; c.feed = []; return c; };
const cardName = c => `${RNA[c.r]} ${ofSuit(c.s)}`;
const emptyBon = () => ({ bac:0, rebac:0, sv:0, limpia:0, nit:0, pixat:0 });
const bonSum = b => b.bac + b.rebac + b.sv + b.limpia + b.nit + (b.pixat || 0);
const scoreTxt = s => s < 20 ? [s, s === 1 ? 'mala' : L('malas', 'males')] : [s - 20, s - 20 === 1 ? L('buena', 'bona') : L('buenas', 'bones')];

// notación corta para el registro: número + palo (o oros, c copas, e espadas, b bastos)
const cn = c => `${RV[c.r]}${'oceb'[c.s]}`;
const SEATC = ['Tú', 'D', 'C', 'I'];
function say(S, txt, k) { if (S.rec) S.rec.lines.push(txt); S.log.push({ txt, k: k || '' }); if (S.log.length > 500) S.log.splice(0, S.log.length - 500); S.feed.push({ txt, k: k || '' }); }

function addPts(S, t, k, n) {
  S.bon[t][k] += n; S.score[t] += n;
  if (!S.over && n > 0 && S.score[t] >= TARGET) {
    S.over = true; S.winner = t; S.phase = 'gameEnd'; S.endMid = true;
    say(S, L(`${TEAMN[t]} llegan a 40: ¡fin de la partida!`, `${TEAMN[t]} arriben a 40: final de la partida!`), 'pts');
  }
}

function newGame() {
  const S = { score:[0,0], dealer: Math.floor(Math.random()*4), handNo:0, log:[], feed:[], over:false, winner:null };
  newHand(S);
  return S;
}

function newHand(S) {
  S.handNo++;
  S.deck = shuffle(ALL.map(c => ({ ...c })));
  S.table = []; S.slots = {}; S.hands = [[],[],[],[]]; S.chain = null; S.lastPlay = null;
  S.cap = [0,0]; S.bon = [emptyBon(), emptyBon()]; S.public = []; S.lastCapturer = null;
  S.round = 0; S.bet = null; S.summary = null; S.duels = []; S.duelNotes = []; S.endMid = false; S.bubbles = ['','','',''];
  S.turn = (S.dealer + 1) % 4;
  S.prevRec = S.rec || null;
  S.rec = { game: 'cau', handNo: S.handNo, dealer: S.dealer, score: S.score.slice(), levels: [SETTINGS.partner, SETTINGS.rivals], socarrat: !!SETTINGS.socarrat, deals: [], lines: [] };
  say(S, L(`Mano ${S.handNo}. Reparte ${NAMES[S.dealer]}.`, `Mà ${S.handNo}. Reparteix ${NAMES[S.dealer]}.`), 'hand');
  // Reparto real: una al centro, una a cada jugador, otra al centro… (4 al centro y 3 a cada uno)
  S.dealSeq = []; S.aside = [];
  const order = [1,2,3,4].map(i => (S.dealer + i) % 4);
  for (let k = 0; k < 4; k++) {
    dealCenter(S);
    if (k < 3) for (const p of order) { const c = S.deck.pop(); S.hands[p].push(c); S.dealSeq.push({ to: p, id: c.id }); }
  }
  S.public.push(...S.table.map(c => c.id));
  // las pixadas entran en el mazo, cada una en una posición al azar (sin volver a barajar)
  for (const c of S.aside) S.deck.splice(Math.floor(Math.random() * (S.deck.length + 1)), 0, c);
  S.asideIds = S.aside.map(c => c.id);
  S.round = 1;
  if (S.rec) S.rec.deals.push({ round: 1, table: S.table.map(cn), pixat: S.aside.map(cn), hands: S.hands.map(h => h.map(cn)), score: S.score.slice() });
  postDeal(S);
}
// Una carta al centro. Si su número ya está en el tapete «s'ha pixat»: vuelve al mazo, se baraja y sale otra
function dealCenter(S) {
  for (let guard = 0; guard < 50; guard++) {
    const c = S.deck.pop(); const slot = pickSlot(S);
    if (S.table.some(t => t.r === c.r)) {
      S.dealSeq.push({ to: 'T', card: c, slot, pixat: true });
      S.aside.push(c);    // se aparta a la vista de todos; entra en el mazo al acabar de repartir
      say(S, L(`S'ha pixat: ${RNA[c.r]} ya estaba en el tapete. Se aparta y volverá al mazo al acabar de repartir.`, `S'ha pixat: ${RNA[c.r]} ja estava al tapet. S'aparta i tornarà a la baralla en acabar de repartir.`), 'pixat');
      if (SETTINGS.socarrat) { const t = 1 - team(S.dealer); say(S, L(`Sóc socarrat: ${TEAMN[t]} se apuntan 1.`, `Sóc socarrat: ${TEAMN[t]} s'apunten 1.`), 'pts'); addPts(S, t, 'pixat', 1); }
      continue;
    }
    S.slots[c.id] = slot; S.table.push(c);
    S.dealSeq.push({ to: 'T', card: c, slot });
    return;
  }
}

function combo(hand) {
  const cnt = {}; hand.forEach(c => cnt[c.r] = (cnt[c.r] || 0) + 1);
  let best = null;
  for (const r in cnt) {
    const n = cnt[r]; if (n < 2) continue;
    const c = { t: n >= 3 ? 2 : 1, r: +r };
    if (!best || c.t > best.t || (c.t === best.t && c.r > best.r)) best = c;
  }
  return best;
}
const comboTxt = c => c.t === 2 ? L(`rondín de ${RNP[c.r]}`, `rondí de ${RNP[c.r]}`) : L(`pareja de ${RNP[c.r]}`, `parella de ${RNP[c.r]}`);

function deal(S) {
  S.round++;
  S.lastPlay = null;                // cada reparto empieza jugada nueva: no hay bac sobre la última carta
  S.dealSeq = [];
  for (let k = 0; k < 3; k++) for (let i = 0; i < 4; i++) { const p = (S.dealer + 1 + i) % 4, c = S.deck.pop(); S.hands[p].push(c); S.dealSeq.push({ to: p, id: c.id }); }
  if (S.rec) S.rec.deals.push({ round: S.round, table: S.table.map(cn), hands: S.hands.map(h => h.map(cn)), score: S.score.slice() });
  postDeal(S);
}
function postDeal(S) {
  if (S.over) { S.phase = 'gameEnd'; return; }
  S.hands.forEach(h => h.sort((a, b) => a.r - b.r || a.s - b.s));
  S.dealStart = S.turn;
  S.dealCombos = [0,1,2,3].map(p => combo(S.hands[p]));
  S.sung = [null,null,null,null]; S.first = [false,false,false,false]; S.second = [false,false,false,false];
  S.inf = { no: [[],[],[],[]], soft: [[],[],[],[]], played: [[],[],[],[]] };
  S.nitState = 'open'; S.nitContested = false;
  S.phase = 'play';
  if (S.round === 3) {
    // Último reparto: se canta sin esperar el turno
    for (const p of dealOrder(S)) if (p !== 0 && S.dealCombos[p]) sing(S, p);
    if (S.dealCombos[0]) S.phase = 'singLast'; else resolveNit(S);
  }
}
const dealOrder = S => [0,1,2,3].map(i => (S.dealStart + i) % 4);

function sing(S, p) {
  S.sung[p] = S.dealCombos[p];
  S.bubbles[p] = 'De nit';
  say(S, p === 0 ? L('Cantas «de nit».', 'Cantes «de nit».') : `${NAMES[p]} canta «de nit».`, 'sing');
}
function canFirst(S, p) {
  return S.phase === 'play' && S.turn === p && S.round < 3 && S.nitState === 'open' && !S.first[p] && !S.sung[p] && !!S.dealCombos[p] && S.hands[p].length === 3;
}
function canSecond(S, p) {
  return S.phase === 'play' && S.turn === p && S.nitState === 'resolved' && !S.nitContested && S.sung[p] && S.sung[p].t === 2 && !S.second[p] && S.hands[p].length === 2;
}
function singSecond(S, p) {
  S.second[p] = true; S.bubbles[p] = 'De nit ×2';
  say(S, p === 0 ? L('Vuelves a cantar «de nit»: tienes rondín.', 'Tornes a cantar «de nit»: tens rondí.') : L(`${NAMES[p]} vuelve a cantar «de nit»: tenía rondín.`, `${NAMES[p]} torna a cantar «de nit»: tenia rondí.`), 'sing');
  addPts(S, team(p), 'nit', 1);
}
// Alguien canta en su turno: los que también tienen de nit (y aún no han jugado en este reparto) lo dicen en ese momento
function startSing(S, p) {
  sing(S, p);
  const order = [1,2,3].map(i => (p + i) % 4);
  const resp = order.filter(q => S.dealCombos[q] && !S.sung[q] && !S.first[q]);
  for (const q of resp) if (q !== 0) sing(S, q);
  if (resp.includes(0)) { S.phase = 'singResp'; S.singer = p; }
  else resolveNit(S);
}
// Se resuelve el de nit: si solo canta una pareja se apunta 1 por cada canto; si cantan las dos, se habla
function resolveNit(S) {
  if (S.nitState !== 'open') return;
  if (S.phase === 'singLast' || S.phase === 'singResp') S.phase = 'play';
  if (!S.sung.some(Boolean)) return;
  const has = [0,1].map(t => [0,1,2,3].some(p => team(p) === t && S.sung[p]));
  if (has[0] && has[1]) {
    const order = dealOrder(S);
    const first = order.find(p => S.sung[p]);
    S.bet = { base: 0, acc: 0, pending: null, turnTeam: team(first), passes: 0, order };
    S.nitState = 'contest'; S.nitContested = true; S.phase = 'nit';
    say(S, L('Las dos parejas tienen de nit: se habla. Solo cuenta lo que se apueste.', "Les dues parelles tenen de nit: es parla. Només compta el que s'aposte."), 'nit');
    return;
  }
  S.nitState = 'resolved';
  for (const p of dealOrder(S)) if (S.sung[p] && !S.over) addPts(S, team(p), 'nit', 1);
  for (const t of [0,1]) if (has[t]) say(S, apunt(t, [0,1,2,3].filter(p => team(p) === t && S.sung[p]).length), 'pts');
}

function teamBest(S, t) {
  let best = null, bestPos = 99;
  S.bet.order.forEach((p, pos) => {
    if (team(p) !== t) return; const c = S.sung[p]; if (!c) return;
    if (!best || c.t > best.t || (c.t === best.t && c.r > best.r)) { best = c; bestPos = pos; }
  });
  return { c: best, pos: bestPos };
}
function betOptions(S) {
  const b = S.bet;
  if (!b.pending) return ['xic','envit','falta','pass'];
  if (b.pending.falta) return ['vull','novull'];
  if (b.pending.kind === 'xic') return ['xac','envit','falta','novull'];
  return ['vull','novull','torne','falta'];
}
const BETL = o => ({ pass: L('Passe (ellos ganan 1)', 'Passe (ells guanyen 1)'), xic:'Xic (1)', envit:'Envide (2)', torne: L('Torne a envidar (2 más)', 'Torne a envidar (2 més)'), falta:'La partida', xac:'Xac', vull:'Vull', novull:'No vull' })[o];
const BETSAY = o => (LANG === 'va' ? { pass:'passen', xic:'diuen «xic»', envit:'envíden 2', torne:'tornen a envidar', falta:'es juguen la partida', xac:'diuen «xac»', vull:'volen', novull:'no volen' }
  : { pass:'pasan', xic:'dicen «xic»', envit:'envidan 2', torne:'vuelven a envidar', falta:'se juegan la partida', xac:'dicen «xac»', vull:'quieren', novull:'no quieren' })[o];
function betAct(S, t, a) {
  const b = S.bet;
  say(S, `${TEAMN[t]} ${BETSAY(a)}.`, 'nit');
  S.lastBet = { t, a };
  if (a === 'pass') {   // pasar el primero es rendirse: la otra pareja gana 1
    const w = 1 - t; say(S, apunt(w, 1), 'pts');
    S.bet = null; S.nitState = 'resolved'; S.phase = 'play'; addPts(S, w, 'nit', 1); return;
  }
  // Lo que se juega no se suma: xic = 1, envide = 2, torne a envidar = 2 más sobre lo que había
  if (a === 'xic') { b.pending = { by: t, total: 1, kind: 'xic' }; b.turnTeam = 1 - t; return; }
  if (a === 'envit') { if (b.pending) b.acc = b.pending.total; b.pending = { by: t, total: 2, kind: 'envit' }; b.turnTeam = 1 - t; return; }
  if (a === 'torne') { b.acc = b.pending.total; b.pending = { by: t, total: b.pending.total + 2, kind: 'torne' }; b.turnTeam = 1 - t; return; }
  if (a === 'falta') { if (b.pending) b.acc = b.pending.total; b.pending = { by: t, falta: true }; b.turnTeam = 1 - t; return; }
  if (a === 'vull' || a === 'xac') { if (b.pending.falta) return showdown(S, true); b.acc = b.pending.total; return showdown(S, false); }
  if (a === 'novull') {
    const w = b.pending.by, pts = Math.max(1, b.acc);
    say(S, apunt(w, pts), 'pts');
    S.bet = null; S.nitState = 'resolved'; S.phase = 'play'; addPts(S, w, 'nit', pts);
  }
}
function showdown(S, falta) {
  const A = teamBest(S, 0), B = teamBest(S, 1);
  const w = (A.c.t !== B.c.t) ? (A.c.t > B.c.t ? 0 : 1) : (A.c.r !== B.c.r ? (A.c.r > B.c.r ? 0 : 1) : (A.pos < B.pos ? 0 : 1));
  const pts = S.bet.acc;
  S.bet = null; S.nitState = 'resolved'; S.phase = 'play';
  // No se enseñan las cartas: quién gana se sabe al final de la mano
  (S.duels = S.duels || []).push({ w, pts, falta, a: comboTxt(A.c), b: comboTxt(B.c), round: S.round });
  say(S, L(`De nit aceptado: ${falta ? 'se juegan la partida' : `en juego ${pts}`}. Se verá al acabar el reparto.`, `De nit acceptat: ${falta ? 'es juguen la partida' : `en joc ${pts}`}. Es veurà en acabar el repartiment.`), 'pts');
}

function takeEscala(S, r) {
  const got = [];
  for (let x = r + 1; x < 10; x++) { const j = S.table.findIndex(c => c.r === x); if (j < 0) break; got.push(S.table.splice(j, 1)[0]); }
  return got;
}
function escLen(S, r) { let n = 0; for (let x = r + 1; x < 10; x++) { if (!S.table.some(c => c.r === x)) break; n++; } return n; }
// Huecos del tapete: cada carta cae en uno libre, con un poco de desorden, y no se mueve hasta que la recogen
const SLOTPOS = [[20,14],[50,14],[80,14],[20,38],[50,38],[80,38],[20,62],[50,62],[80,62],[20,86],[50,86],[80,86]];
function pickSlot(S) {
  const used = new Set(S.table.map(c => S.slots[c.id] && S.slots[c.id].i));
  if (S.chain && S.chain.slot) used.add(S.chain.slot.i);
  const free = SLOTPOS.map((_, i) => i).filter(i => !used.has(i));
  const i = free.length ? free[Math.floor(Math.random() * free.length)] : Math.floor(Math.random() * SLOTPOS.length);
  const j = () => Math.random() * 2 - 1;
  return { i, dx: +(j() * 2.5).toFixed(1), dy: +(j() * 2.5).toFixed(1), rot: +(j() * 8).toFixed(1) };
}
function resolveChain(S, ev, noLimpia) {
  const ch = S.chain; S.chain = null;
  const got = ch.cards.concat(takeEscala(S, ch.r)); const t = team(ch.owner);
  S.cap[t] += got.length; S.lastCapturer = ch.owner;
  ev.push({ k:'cobra', p: ch.owner, txt: ch.owner === 0 ? L(`Te llevas ${got.length} cartas`, `T'endús ${got.length} cartes`) : L(`${NAMES[ch.owner]} se lleva ${got.length} cartas`, `${NAMES[ch.owner]} s'endú ${got.length} cartes`) });
  if (!ch.limpia && !noLimpia && S.table.length === 0) { ev.push({ k:'limpia', p: ch.owner, txt: L('¡Limpia!', 'Limpia!'), pts:1 }); addPts(S, t, 'limpia', 1); }
  return got.map(c => c.id);
}

// Aplica una jugada. Devuelve los eventos y las cartas que salen de la mesa.
function noteInference(S, p, card) {
  // Lo que cualquiera en la mesa puede deducir: si no hace bac o rebac pudiendo, no tenía ese número
  // (en el resto del reparto ya no le entra ninguna carta); si no captura pudiendo, probablemente tampoco.
  const I = S.inf || (S.inf = { no: [[],[],[],[]], soft: [[],[],[],[]], played: [[],[],[],[]] });
  const add = (a, r) => { if (!a.includes(r)) a.push(r); };
  I.played[p].push(card);

let calloutTimer = null;
async function callout(txt, sub, wait = true) {

}

async function drainFeed(untilDeal) {
  // con untilDeal se muestra solo lo ocurrido antes del nuevo reparto (p. ej. el de nit que se descubre)
  let n = S.feed.length;
  if (untilDeal) { const k = S.feed.findIndex(i => i.k === 'hand'); if (k >= 0) n = k + 1; }
  const items = S.feed.splice(0, n);
  for (const i of items) {
    if (i.k === 'sing') { narr = i.txt; render(); await callout('De nit', /^(Cantas|Vuelves|Cantes|Tornes)/.test(i.txt) ? NAMES[0] : i.txt.split(' ')[0]); }
    else if (i.k === 'nit' || i.k === 'pts') { narr = i.txt; render(); await sleep(1100); }
    else if (i.k === 'duel') { narr = i.txt; render(); await callout('De nit', i.txt.split('. ').slice(-1)[0].replace('.', '')); await sleep(1200); }
  }
}

async function doPlay(p, cid) {
  const sim = clone(S); sim.feed = [];
  const res = applyPlay(sim, p, cid);
  const special = res.ev.find(e => ['bac','rebac','sv','limpia'].includes(e.k));
  // 1) la carta cae en la mesa
  const slot = sim.slots[res.card.id] && sim.table.some(c => c.id === res.card.id) ? sim.slots[res.card.id] : null;
  fx = { card: res.card, take: [], p, slot };
  S.bubbles[p] = '';
  narr = `<b>${NAMES[p]}</b> ${p === 0 ? L('juegas', 'jugues') : L('juega', 'juga')} ${cardName(res.card)}.`;
  render();
  await sleep(900);
  // 2) se marcan las cartas que se lleva
  const cap = res.ev.find(e => e.k === 'cap'), cobra = res.ev.find(e => e.k === 'cobra');
  if (res.take.length || special) {
    const glow = special && ['bac','rebac','sv'].includes(special.k) && sim.chain ? sim.chain.cards.map(c => c.id) : [];
    fx = { card: res.card, take: res.take, p, slot, glow };
    const who = special ? special.p : p;
    narr = `${cobra ? cobra.txt + '. ' : ''}${special ? `<b>${NAMES[who]}</b>: <b>${special.txt}</b> +${special.pts}` : cap ? `<b>${NAMES[p]}</b> ${L(`captura ${cap.n} cartas.`, `arreplega ${cap.n} cartes.`)}` : ''}`;
    render();
    if (special) await callout(special.txt, `${NAMES[who]} · +${special.pts}`);
    else await sleep(1100);
  } else await sleep(300);
  fx = null;
  sim.bubbles[p] = cap ? cap.txt : '';
  if (special) sim.bubbles[special.p] = special.txt.replace(/[¡!]/g, '');
  say(sim, `${p === 0 ? L('Juegas', 'Jugues') : NAMES[p] + L(' juega', ' juga')} ${cardName(res.card)} — ${res.ev.map(e => e.txt).join(' · ')}.`);
  const roundBefore = sim.round;
  afterPlay(sim);
  if (sim.round !== roundBefore && sim.phase !== 'handEnd') sim.bubbles = sim.bubbles.map((b, i) => sim.sung && sim.sung[i] ? b : '');
  S = sim;
  if (S.round !== roundBefore && S.phase !== 'handEnd' && S.phase !== 'gameEnd') {
    // las cartas nuevas no se ven hasta que llegan volando
    dealView = { n: [0, 0, 0, 0], table: true, tableIds: new Set(), temp: null };
    render(); await drainFeed(true);
    narr = L(`Reparto ${S.round} de 3.`, `Repartiment ${S.round} de 3.`);
    await animateDeal(false);
  }
  render();
  await drainFeed();
}

// Animación de reparto: los paquetes de 3 cartas salen de quien reparte hacia cada jugador
async function animateDeal(withTable) {
  const seq = S.dealSeq || [];
  dealView = { n: [0,0,0,0], table: !withTable, tableIds: new Set(), temp: null };
  render();
  await sleep(450);
  const center = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  const src = S.dealer === 0 ? $('hand') : ($('seat' + S.dealer).querySelector('.av') || $('seat' + S.dealer));
  const [ox, oy] = center(src);
  const slotXY = sl => { const r = $('table').getBoundingClientRect(); const [x, y] = SLOTPOS[sl.i]; return [r.left + r.width * (x + sl.dx) / 100, r.top + r.height * (y + sl.dy) / 100]; };
  const fly = async (from, to) => {
    if (reduce) return;
    const f = document.createElement('div'); f.className = 'fly'; f.innerHTML = '<span class="back"></span>'; document.body.appendChild(f);
    const w = f.offsetWidth / 2, h = f.offsetHeight / 2;
    const a = f.animate([{ transform: `translate(${from[0] - w}px,${from[1] - h}px) scale(.75)` }, { transform: `translate(${to[0] - w}px,${to[1] - h}px) scale(1)` }], { duration: 230 * SPEEDS[speedIx][1], easing: 'cubic-bezier(.3,.7,.3,1)' });
    await a.finished.catch(() => {}); f.remove();
  };
  const gen = GEN;
  for (const st of seq) {
    if (gen !== GEN || isCoto()) return;
    if (st.to === 'T') {
      await fly([ox, oy], slotXY(st.slot));
      if (gen !== GEN || !dealView) return;
      if (st.pixat) {
        dealView.temp = { card: st.card, slot: st.slot }; renderTable();
        narr = L(`<b>S'ha pixat:</b> ${RNA[st.card.r]} ya estaba en el tapete. Se aparta y volverá al mazo al acabar de repartir.`, `<b>S'ha pixat:</b> ${RNA[st.card.r]} ja estava al tapet. S'aparta i tornarà a la baralla en acabar de repartir.`); $('narr').innerHTML = narr;
        await callout("S'ha pixat", SETTINGS.socarrat ? `${TEAMN[1 - team(S.dealer)]} · +1` : `${RN[st.card.r]} ${L('repetido', 'repetit')}`);
        dealView.temp = null; renderTable();
        await fly(slotXY(st.slot), [ox, oy]);
      } else { dealView.tableIds.add(st.card.id); renderTable(); }
    } else {
      const p = st.to;
      await fly([ox, oy], center(p === 0 ? $('hand') : ($('seat' + p).querySelector('.backs') || $('seat' + p))));
      if (gen !== GEN || !dealView) return;
      dealView.n[p]++; p === 0 ? renderHand() : renderSeat(p);
    }
  }
  dealView = null; render();
  await sleep(700);
}
async function beginHand() {
  dealView = { n: [0,0,0,0], table: false, tableIds: new Set(), temp: null };
  busy = true; const gen = GEN;
  try { await animateDeal(true); await drainFeed(); } finally { if (gen === GEN) busy = false; }
  if (gen !== GEN) return;
  render(); loop();
}

async function loop() {
  if (isCoto()) return cotoLoop();
  if (busy) return; busy = true; const gen = GEN;
  try {
    while ((!S.over || S.phase === 'play') && gen === GEN && !isCoto()) {
      while (!$('overlay').hidden && !['handEnd','gameEnd'].includes(S.phase)) await new Promise(r => setTimeout(r, 200));
      save();
      if (S.over) break;
      if (S.phase === 'play') {
        if (S.turn === 0) break;
        render();
        await sleep(700);
        if (botSing(S, S.turn)) { render(); await drainFeed(); continue; }
        await sleep(500);
        await doPlay(S.turn, botChoose(S, S.turn));
      } else if (S.phase === 'nit') {
        if (humanSpeaks(S)) break;
        render();
        await sleep(1200);
        botBet(S); render(); await drainFeed();
      } else break;
    }
  } finally { if (gen === GEN) { busy = false; save(); render(); } }
}

  <p>El bac queda pendiente en la mesa hasta que juega el siguiente. Si hace rebac, la escala es para él. Si el bac deja la mesa vacía también es limpia (3 puntos), y si le hacen rebac la limpia pasa al que lo hace. La última jugada de la mano no hace limpia.</p>

  `) + close);
}

const lvlName = v => ({ facil: 'fácil', normal: 'normal', dificil: 'difícil', experto: 'muy difícil' })[v] || v;
const strip = t => String(t).replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&');
function exportText(rec) {
  if (!rec) return '';
  const who = `Asientos: Tú, D=${NAMES[1]} (rival derecha), C=${NAMES[2]} (compañera), I=${NAMES[3]} (rival izquierda). Niveles: compañera ${lvlName(rec.levels[0])}, rivales ${lvlName(rec.levels[1])}.`;
  const out = [];
  if (rec.game === 'coto') {
    out.push(`COTO · partida ${rec.partidaNo} · ${rec.vueltas ? 'MANO DE VUELTAS' : 'primera mano (no es de vueltas)'} · mano nº ${rec.handNo}`);
    out.push(`Coto al mejor de ${rec.bestOf}: nosotros ${rec.wins[0]} - ellos ${rec.wins[1]} partidas`);
    out.push(`Marcador al empezar la mano: nosotros ${rec.score[0]} - ellos ${rec.score[1]} (se sale a 101${rec.vueltas ? ', se cuenta en cuanto se llega' : ''})`);
    out.push(`Reparte: ${SEATC[rec.dealer]} · Pinta: ${rec.pinta} (triunfo ${SUITN[rec.trump]})`);
    out.push(who, 'Cartas: número + palo (o oros, c copas, e espadas, b bastos). 10 sota, 11 caballo, 12 rey.', '', 'Manos iniciales:');
    rec.hands.forEach((h, q) => out.push(`  ${SEATC[q]}: ${h.join(' ')}`));
    out.push('', ...rec.ev);
    const G2 = isCoto() ? G : null;
    if (G2 && G2.rec === rec && G2.trick.length) out.push(rec.cur + ' … (baza en juego)');
  } else {
    out.push(`CAU · mano ${rec.handNo} · reparte ${SEATC[rec.dealer]}${rec.socarrat ? ' · sóc socarrat' : ''}`);
    out.push(`Marcador al empezar la mano: nosotros ${rec.score[0]} - ellos ${rec.score[1]} (malas/buenas: 20+20, se gana a 40)`);
    out.push(who, 'Cartas: número + palo (o oros, c copas, e espadas, b bastos). 10 sota, 11 caballo, 12 rey.');
    for (const d of rec.deals) {
      out.push('', `Reparto ${d.round} (marcador ${d.score[0]}-${d.score[1]}):`);
      if (d.table && d.table.length) out.push(`  Mesa: ${d.table.join(' ')}`);
      if (d.pixat && d.pixat.length) out.push(`  Pixat (apartadas): ${d.pixat.join(' ')}`);
      d.hands.forEach((h, q) => out.push(`  ${SEATC[q]}: ${h.join(' ')}`));
    }
    out.push('', 'Jugadas:', ...rec.lines.map(l => '  ' + strip(l)));
  }
  return out.join('\n');
}
async function doExport(prev) {
  const X = isCoto() ? G : S, rec = prev ? X.prevRec : X.rec;
  const txt = exportText(rec);
  const box = $('expbox'); if (!box) return;
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) {}
  box.innerHTML = `<p class="desc">${ok ? L('Copiado. Pégalo en el chat.', 'Copiat. Apega-ho en el xat.') : L('Mantén pulsado el texto para copiarlo.', 'Mantín polsat el text per a copiar-lo.')}</p><textarea class="exp" readonly>${esc(txt)}</textarea>`;
  const ta = box.querySelector('textarea'); if (!ok && ta) { ta.focus(); ta.select(); }
}

async function coDrain() {

const coCenter = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
const coSeatTarget = p => p === 0 ? $('hand') : ($('seat' + p).querySelector('.backs') || $('seat' + p));
async function coFly(from, to, html, ms = 260) {

  const w = f.offsetWidth / 2, h = f.offsetHeight / 2;
  const a = f.animate([{ transform: `translate(${from[0] - w}px,${from[1] - h}px)` }, { transform: `translate(${to[0] - w}px,${to[1] - h}px)` }], { duration: ms * SPEEDS[speedIx][1], easing: 'cubic-bezier(.3,.7,.3,1)' });
  await a.finished.catch(() => {}); f.remove();
}
// después de cada baza: cada uno roba del montón, empezando por quien la ha ganado
async function coAnimDraw() {
  const draws = G.lastDraw || []; if (!draws.length) return;
  draws.forEach(d => coHide.add(d.id));
  render();
  const st = $('costock'), origin = st ? coCenter(st) : coCenter($('table'));
  for (const d of draws) {
    const isPinta = !G.stock.length && d === draws[draws.length - 1];
    await coFly(origin, coCenter(coSeatTarget(d.p)), isPinta || d.p === 0 ? `<div style="--cw:46px">${cardHTML(coCard(d.id))}</div>` : '<span class="back"></span>', 240);
    coHide.delete(d.id); coPend = Math.max(0, coPend - 1); d.p === 0 ? coRenderHand() : coRenderSeat(d.p); coRenderTable(); $('info') && renderCotoInfo();
  }

  render();
}
// cambiar el 7: el 7 va al centro y la pinta va a la mano de quien lo cambia
async function coAnimSwap(p) {
  const seven = G.hands[p].find(c => c.s === G.trump && c.r === C_SIETE), pinta = G.pinta;
  const from = coCenter(coSeatTarget(p)), pc = $('copinta') ? coCenter($('copinta')) : coCenter($('table'));
  await coFly(from, pc, `<div style="--cw:50px">${cardHTML(seven)}</div>`, 420);
  coSwap(G, p); coHide.add(pinta.id); render();
  await coFly(pc, from, `<div style="--cw:50px">${cardHTML(pinta)}</div>`, 420);
  coHide.delete(pinta.id); render();
}
async function coDoPlay(p, id) {
  const c = G.hands[p].find(x => x.id === id);
  coFx = { p, id };
  const r = coPlay(G, p, id);
  // lo que se roba ya está en las manos del motor: se esconde hasta que llegue volando
  if (r.done && G.lastDraw && G.lastDraw.length) { G.lastDraw.forEach(d => coHide.add(d.id)); coPend = G.lastDraw.length; }
  narr = `<b>${NAMES[p]}</b> ${p === 0 ? L('juegas', 'jugues') : L('juega', 'juga')} ${cardName(c)}.`;
  if (!r.done) { render(); await sleep(520); coFx = null; return; }
  coShowLast = true; render(); await sleep(750);
  narr = `<b>${NAMES[r.winner]}</b> ${r.winner === 0 ? L('ganas la baza', 'guanyes la basa') : L('gana la baza', 'guanya la basa')}: ${r.pts} ${L('puntos', 'punts')}${r.last ? L(' (con las 10 de últimas)', " (amb les 10 d'últimes)") : ''}.`;
  render(); await callout(r.pts >= 10 ? `+${r.pts}` : L('Baza', 'Basa'), NAMES[r.winner]);
  coShowLast = false; coFx = null;

async function cotoLoop() {
  if (busy) return; busy = true; const gen = GEN;
  try {
    while (gen === GEN && isCoto()) {
      while (!$('overlay').hidden && G.phase === 'play') await new Promise(r => setTimeout(r, 200));
      save();
      if (G.phase !== 'play') break;
      let sang = false;
      for (let i = 0; i < 4; i++) { const q = (G.turn + i) % 4; if (q === 0) continue; const ss = coCantesFor(G, q); if (ss.length) { for (const s of ss) coSing(G, q, s); sang = true; } }
      if (sang) { render(); await coDrain(); continue; }
      if (coCantesFor(G, 0).length && G.cantePass !== G.trickNo && G.turn !== 0) break;
      if (G.turn === 0) break;
      render(); await sleep(650);
      const p = G.turn;
      if (coCanSwap(G, p)) { await coAnimSwap(p); await coDrain(); }
      await sleep(350);
      await coDoPlay(p, coBotChoose(G, p, levelOf(p)));
    }

}
async function animateCotoDeal() {

  render(); await sleep(400);
  const center = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  const src = G.dealer === 0 ? $('hand') : ($('seat' + G.dealer).querySelector('.av') || $('seat' + G.dealer));
  const [ox, oy] = center(src);
  const fly = async (to, n) => {
    if (reduce) return;
    const f = document.createElement('div'); f.className = 'fly'; f.innerHTML = '<span class="back"></span>'.repeat(n); document.body.appendChild(f);
    const w = f.offsetWidth / 2, h = f.offsetHeight / 2;
    const a = f.animate([{ transform: `translate(${ox - w}px,${oy - h}px) scale(.75)` }, { transform: `translate(${to[0] - w}px,${to[1] - h}px) scale(1)` }], { duration: 150 * SPEEDS[speedIx][1], easing: 'cubic-bezier(.3,.7,.3,1)' });
    await a.finished.catch(() => {}); f.remove();
  };
  const gen = GEN;
  for (const st of G.dealSeq) {
    if (gen !== GEN || !isCoto()) return;
    const p = st.to;
    await fly(center(p === 0 ? $('hand') : ($('seat' + p).querySelector('.backs') || $('seat' + p))), st.n);
    if (gen !== GEN || !coDealView) return;
    coDealView.n[p] += st.n; p === 0 ? coRenderHand() : coRenderSeat(p);
  }
  const tb = $('table').getBoundingClientRect();
  // se destapa la pinta
  await fly([tb.left + tb.width * 0.5, tb.top + tb.height * 0.5], 1);
  if (gen !== GEN || !coDealView) return;
  coDealView.stock = true; coRenderTable();
  await sleep(500);
  if (gen !== GEN) return;
  // se ordena la mano (triunfos a la derecha) con una pequeña animación
  const before = {}; $('hand').querySelectorAll('.hc').forEach(b => before[b.dataset.id] = b.getBoundingClientRect().left);
  coDealView = null;
  render();
  if (!reduce) {
    const anims = [];
    $('hand').querySelectorAll('.hc').forEach(b => { const dx = (before[b.dataset.id] ?? 0) - b.getBoundingClientRect().left; if (Math.abs(dx) > 1) anims.push(b.animate([{ transform: `translate(${dx}px,-14px)` }, { transform: 'translate(0,-14px)', offset: .75 }, { transform: 'translate(0,0)' }], { duration: 520 * SPEEDS[speedIx][1], easing: 'cubic-bezier(.3,.7,.3,1)' }).finished.catch(() => {})); });
    await Promise.all(anims);
    if (gen !== GEN) return;
  }
  narr = L(`Pintan <b>${SUITN[G.trump]}</b>.`, `Pinten <b>${SUITN[G.trump]}</b>.`);
  render(); await callout(L(`Pintan ${SUITN[G.trump]}`, `Pinten ${SUITN[G.trump]}`), cardName(G.pinta));
}
async function beginCoto() {
  coDealView = { n: [0, 0, 0, 0], stock: false };
  busy = true; const gen = GEN;
  try { G.feed = []; await animateCotoDeal(); } finally { if (gen === GEN) busy = false; }
  if (gen !== GEN) return;
  render(); cotoLoop();
}
function showCotoSummary() {
  shareRec(G.rec, 'coto', { score: G.score.slice(), phase: G.phase, partidaWinner: G.partidaWinner ?? null, wins: G.wins.slice(), mid: !!G.endMid, summary: G.handSummary || null });
  const H = G.handSummary || [{ pts: 0, cantes: 0, ultimas: 0, total: 0 }, { pts: 0, cantes: 0, ultimas: 0, total: 0 }];
  const row = (l, k) => `<tr><td>${l}</td><td>${H[0][k]}</td><td>${H[1][k]}</td></tr>`;

  let title, btn;
  if (G.phase === 'handEnd') { title = L('Nadie llega a 101: mano de vueltas', 'Ningú arriba a 101: mà de voltes'); btn = `<button class="btn primary" type="button" data-act="co-next">${L('Jugar de vueltas', 'Jugar de voltes')}</button>`; }
  else if (G.phase === 'partidaEnd') {

    btn = `<button class="btn primary" type="button" data-act="co-next">${L('Siguiente partida', 'Partida següent')}</button>`;
  } else {
    title = G.winner === 0 ? L('¡Habéis ganado el coto!', 'Heu guanyat el coto!') : L('Han ganado el coto ellos', 'Han guanyat el coto ells');
    btn = APP.mode === 'cotocau' ? `<button class="btn primary" type="button" data-act="match">${L('Continuar', 'Continuar')}</button>` : `<button class="btn primary" type="button" data-act="newcoto">${L('Nuevo coto', 'Coto nou')}</button>`;
  }
  const why = G.endMid ? `<p>${L('Se han salido en la mano de vueltas al llegar a 101.', "S'han eixit en la mà de voltes en arribar a 101.")}</p>` : '';
  showPanel(`<h2>${title}</h2>${why}
  <table class="sum"><thead><tr><th></th><th class="us">${TEAMN[0]}</th><th class="them">${TEAMN[1]}</th></tr></thead><tbody>
  ${row(L('Puntos de bazas', 'Punts de bases'), 'pts')}${row(L('Cantes', 'Cants'), 'cantes')}${row(L('10 de últimas', "10 d'últimes"), 'ultimas')}
  <tr class="tot"><td>${L('Total de la mano', 'Total de la mà')}</td><td>${H[0].total}</td><td>${H[1].total}</td></tr>
  <tr class="tot"><td>${L('Marcador', 'Marcador')}</td><td>${sc(0)}</td><td>${sc(1)}</td></tr>
  <tr class="tot"><td>Coto (${L('al mejor de', 'al millor de')} ${G.bestOf})</td><td>${G.wins[0]}</td><td>${G.wins[1]}</td></tr></tbody></table>
  <div class="acts">${btn}</div>`);
}

/* ---------- CotoCau: coto, después Cau y, si cada pareja gana uno, sorteo «llargues coto, curtes cau» ---------- */
function matchStatus() {
  const M = APP.M; if (!M) return '';
  const r = w => w == null ? '—' : TEAMN[w];
  return `Coto: ${r(M.res.coto)} · Cau: ${r(M.res.cau)}${M.tb ? ` · ${L('Desempate', 'Desempat')} (${M.tb === 'coto' ? 'Coto' : 'Cau'}): ${r(M.res.tb)}` : ''}`;
}
function matchNext() {
  const M = APP.M;
  if (M.stage === 'coto') {
    M.res.coto = G.winner; M.stage = 'cau'; M.cur = 'cau';
    S = newGame(); S.feed = []; save();
    dealView = { n: [0, 0, 0, 0], table: false, tableIds: new Set(), temp: null };   // que no se vea la mano del Cau antes de repartir
    showPanel(`<h2>${L('Coto acabado', 'Coto acabat')}</h2><p>${matchStatus()}</p><p>${L('Ahora se juega el Cau a 40.', 'Ara es juga el Cau a 40.')}</p><div class="acts"><button class="btn primary" type="button" data-act="match-go">${L('Empezar el Cau', 'Començar el Cau')}</button></div>`);
    return;
  }
  if (M.stage === 'cau') {
    M.res.cau = S.winner;
    if (M.res.cau === M.res.coto) return matchDone(M.res.coto);
    M.stage = 'draw'; save(); return showDraw();
  }
  if (M.stage === 'tb') { M.res.tb = M.tb === 'coto' ? G.winner : S.winner; return matchDone(M.res.tb); }
}
function matchDone(w) {
  APP.M.stage = 'done'; APP.M.winner = w; save();
  showPanel(`<h2>${w === 0 ? L('¡Habéis ganado el CotoCau!', 'Heu guanyat el CotoCau!') : L('Han ganado el CotoCau ellos', 'Han guanyat el CotoCau ells')}</h2><p>${matchStatus()}</p><div class="acts"><button class="btn primary" type="button" data-act="menu">${L('Volver al menú', 'Tornar al menú')}</button></div>`);
}
function showDraw() {
  const M = APP.M;
  if (M.drawCard == null) { M.drawCard = Math.floor(Math.random() * 40); save(); }
  const c = ALL[M.drawCard]; const curtes = c.s === 0 || c.s === 1;
  M.tb = curtes ? 'cau' : 'coto';
  showPanel(`<h2>${L('Desempate', 'Desempat')}</h2><p>${matchStatus()}</p>
  <p class="big-result">«Llargues coto, curtes cau»</p>
  <p>${L('Se baraja, se corta y se saca una carta: oros o copas son cortas (Cau); bastos o espadas, largas (Coto).', "Es barreja, es talla i se'n trau una: oros o copes són curtes (Cau); bastos o espases, llargues (Coto).")}</p>
  <div class="draw"><div class="draw-card">${cardHTML(c)}</div></div>
  <p class="big-result draw-res">${curtes ? L(`${SUITN[c.s]}: curtes → Cau`, `${SUITN[c.s]}: curtes → Cau`) : L(`${SUITN[c.s]}: llargues → Coto`, `${SUITN[c.s]}: llargues → Coto`)}</p>
  <div class="acts"><button class="btn primary" type="button" data-act="match-tb">${L('Jugar el desempate', 'Jugar el desempat')}</button></div>`);
}
function matchGo() {
  closePanel();
  if (APP.M.stage === 'cau') { narr = L(`Mano 1. Reparte ${NAMES[S.dealer]}.`, `Mà 1. Reparteix ${NAMES[S.dealer]}.`); beginHand(); }
}
function matchTiebreak() {
  const M = APP.M; M.stage = 'tb'; M.cur = M.tb; closePanel();
  if (M.tb === 'coto') { G = cotoNewMatch(SETTINGS.cotoBest || 5); beginCoto(); }
  else { S = newGame(); S.feed = []; narr = L(`Mano 1. Reparte ${NAMES[S.dealer]}.`, `Mà 1. Reparteix ${NAMES[S.dealer]}.`); beginHand(); }
}
let GEN = 0;
function startGame(mode) {
  GEN++; busy = false; coDealView = null; dealView = null; fx = null; coFx = null; coShowLast = false; coHide = new Set(); coPend = 0; coReveal = false;
  APP.mode = mode; APP.M = mode === 'cotocau' ? { stage: 'coto', cur: 'coto', res: {} } : null;
  hasSaved = true; closePanel();
  if (mode === 'cau') { S = newGame(); S.feed = []; narr = L(`Mano 1. Reparte ${NAMES[S.dealer]}.`, `Mà 1. Reparteix ${NAMES[S.dealer]}.`); beginHand(); return; }
  G = cotoNewMatch(SETTINGS.cotoBest || 5); beginCoto();
}
function continueLabel() {
  if (APP.mode === 'cau' && S) { const [n, w] = scoreTxt(S.score[0]), [m, v] = scoreTxt(S.score[1]); return `Cau · ${L('Mano', 'Mà')} ${S.handNo} · ${n} ${w} – ${m} ${v}`; }
  if (APP.mode === 'coto' && G) return `Coto · ${L('Partida', 'Partida')} ${G.partidaNo} · ${G.wins[0]}–${G.wins[1]}`;
  if (APP.mode === 'cotocau' && APP.M) return `CotoCau · ${APP.M.cur === 'coto' ? 'Coto' : 'Cau'}`;
  return L('Continuar partida', 'Continuar la partida');
}
function savedActive() {
  if (APP.mode === 'cau') return !!(S && !S.over);
  if (APP.mode === 'coto') return !!(G && !G.over);
  if (APP.mode === 'cotocau') return !!(APP.M && APP.M.stage !== 'done');
  return false;
}
function showPlay() {
  panelBack = 'menu';
  const lock = SETTINGS.unlocked ? '' : '🔒 ';
  const dev = `<span class="devtag">${L('En desarrollo', 'En desenvolupament')}</span>`;
  showPanel(`<div class="menu" style="display:flex;flex-direction:column;gap:14px"><h2>${L('Jugar', 'Jugar')}</h2><div class="stack">
    <button class="btn playopt" type="button" data-act="play-cotocau"><b>${lock}CotoCau</b>${dev}<small>${L('Juego completo: Coto, después Cau y desempate', 'Joc complet: Coto, després Cau i desempat')}</small></button>
    <button class="btn playopt" type="button" data-act="play-coto"><b>${lock}Coto</b>${dev}<small>${L(`Al mejor de ${SETTINGS.cotoBest || 5} partidas`, `Al millor de ${SETTINGS.cotoBest || 5} partides`)}</small></button>
    <button class="btn playopt" type="button" data-act="play-cau"><b>Cau</b><small>${L('Partida a 40', 'Partida a 40')}</small></button>
  </div><div class="acts"><button class="btn" type="button" data-act="back">${L('Volver', 'Tornar')}</button></div></div>`);

function showPassword(target, wrong) {

  <button class="btn primary" type="submit">${L('Entrar', 'Entrar')}</button></form>${wrong ? `<p class="pwerr">${L('Contraseña incorrecta.', 'Contrasenya incorrecta.')}</p>` : ''}
  <div class="acts"><button class="btn" type="button" data-act="play">${L('Volver', 'Tornar')}</button></div>`);
  $('panel').dataset.target = target;
  setTimeout(() => { const i = $('pw'); if (i) i.focus(); }, 50);

window.CAU = { APP, cotoNewMatch, coNext, exportText, coSwap, coCanSwap, coBotChoose, coPlay, coLegal, get G() { return G; }, set G(v) { G = v; }, set S(v) { S = v; }, render, matchNext, newGame, newHand, applyPlay, afterPlay, INFER, SMART, holdProb, determinize, botChoose, botChooseHard, botChooseNormal, botChooseEasy, botChooseDificil, botChooseExperto, botBet, botSing, SETTINGS, betAct, betOptions, sing, startSing, resolveNit, canFirst, canSecond, cardSVG, get S() { return S; } };

function start(data) {
  if (data && data.app) { Object.assign(APP, data.app); S = data.S; G = data.G; if (S) S.feed = []; if (G) G.feed = []; hasSaved = true; render(); loop(); return; }
  const app = loadApp();
  if (app) {
    APP.mode = app.mode; APP.M = app.M; S = app.S || newGame(); G = app.G; S.feed = S.feed || []; if (G) G.feed = [];
    if (S && !S.slots) { S.slots = {}; const tb = S.table; S.table = []; for (const c of tb) { S.slots[c.id] = pickSlot(S); S.table.push(c); } }
    hasSaved = savedActive(); render(); showMenu(); setTimeout(shareFlush, 2000); return;
  }
  const saved = load();
  if (saved && !saved.slots) {   // partidas guardadas con la versión anterior
    saved.slots = {}; const tb = saved.table; saved.table = [];
    for (const c of tb) { saved.slots[c.id] = pickSlot(saved); saved.table.push(c); }
    if (saved.chain) saved.chain.slot = pickSlot(saved);
  }
  hasSaved = !!(saved && !saved.over);
  S = saved || newGame(); S.feed = [];
  render(); showMenu(); setTimeout(shareFlush, 2000);
}
window.claude?.hot?.snapshot?.(() => ({ S, G, app: { mode: APP.mode, M: APP.M } }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
