<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CotoCau</title>
<style>body{margin:0;background:#1b080d;color:#f3e6d0;font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center}a{color:#e3b24f}</style>
</head><body>
<p>CotoCau se ha mudado a<br><a id="go" href="https://cotocau.github.io/">cotocau.github.io</a></p>
<script>
// CotoCau se ha mudado. Se lleva los datos de este móvil (ajustes, alias, partida a medias y manos pendientes de enviar)
// en la parte «#…» de la dirección, que no viaja a ningún servidor. La clave del online no se lleva: allí se crea una nueva.
(function () {
  var u = 'https://cotocau.github.io/' + location.search, d = {}, h = '';
  try { ['cau.settings', 'cau.uid', 'app.v1', 'cau.v2', 'cau.queue'].forEach(function (k) { var v = localStorage.getItem(k); if (v != null) d[k] = v; }); } catch (e) {}
  try { if (Object.keys(d).length) h = '#mig=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(d))))); } catch (e) {}
  document.getElementById('go').href = u + h;
  // retirar el funcionamiento sin conexión de la dirección antigua (solo el de CotoCau, no el de otras apps de esta web)
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { if (/\/cau\/$/.test(r.scope)) r.unregister(); }); }).catch(function () {});
  setTimeout(function () { location.replace(u + h); }, 50);
})();
</script>
</body></html>
